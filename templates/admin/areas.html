{% extends "admin/base.html" %}
{% block body %}
<div class="card">
  <div class="card__hd"><h2>Service Areas</h2><span class="pill">{{ areas|length }} areas</span></div>
  <div class="card__bd">
    <div class="adm-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));">
      {% for a in areas %}
      <div style="display:flex; align-items:center; gap:10px; padding:12px 16px; background:#f6f9fc; border:1px solid #e4e9f0; border-radius:9px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1f9d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <b style="font-size:14px;">{{ a }}</b>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
