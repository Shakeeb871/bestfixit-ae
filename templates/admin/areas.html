{% extends "admin/base.html" %}
{% block body %}
<div class="form" style="margin-bottom:22px;">
  <h2 id="formTitle" style="font-size:16px; margin-bottom:16px;">Add Service Area</h2>
  <form method="post" action="/admin/areas/save/">
    <input type="hidden" name="index" id="a_index" value="">
    <div class="fld"><label>Area Name</label><input name="name" id="a_name" placeholder="e.g. Dubai Marina" required></div>
    <div class="form__actions">
      <button class="adm-btn adm-btn--solid" type="submit">Save Area</button>
      <button class="adm-btn" type="button" onclick="resetA()">Clear</button>
    </div>
  </form>
</div>
<div class="card">
  <div class="card__hd"><h2>Service Areas</h2><span class="pill">{{ areas|length }} areas</span></div>
  <div class="tbl-wrap">
    <table class="tbl">
      <thead><tr><th style="width:44px;">#</th><th>Area</th><th style="width:160px;">Actions</th></tr></thead>
      <tbody>
        {% for a in areas %}
        <tr>
          <td class="mono">{{ loop.index }}</td>
          <td><b>{{ a }}</b></td>
          <td><div class="act">
            <a href="#" onclick="editA({{ loop.index0 }});return false;">Edit</a>
            <form method="post" action="/admin/areas/{{ loop.index0 }}/delete/" onsubmit="return confirm('Delete this area?')"><button class="del" type="submit">Delete</button></form>
          </div></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
<script>
  var AREAS = {{ areas|tojson }};
  function editA(i){ a_index.value=i; a_name.value=AREAS[i]; formTitle.textContent='Edit Service Area'; window.scrollTo({top:0,behavior:'smooth'}); }
  function resetA(){ a_index.value=''; a_name.value=''; formTitle.textContent='Add Service Area'; }
</script>
{% endblock %}
